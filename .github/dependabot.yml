version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "Local"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "Local"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
