name: Verify

on:
  workflow_dispatch:
  pull_request:
    branches:
      - Local
      - main
  push:
    branches:
      - Local
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Repository policy
        run: npm run verify:repository

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
