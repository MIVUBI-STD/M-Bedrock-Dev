name: Verify

on:
  workflow_dispatch:
  pull_request:
    branches:
      - Local
      - main
  push:
    branches:
      - Local
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Upload dependency lock bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
          retention-days: 1

      - name: Repository policy
        run: npm run verify:repository

      - name: Source hygiene audit
        run: npm run audit:source

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
