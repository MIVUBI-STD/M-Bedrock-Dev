name: Virtual Clients UI

on:
  push:
    branches:
      - Experimental
    paths:
      - "apps/virtual-clients-ui/**"
      - "apps/ownership.json"
      - "package.json"
      - "package-lock.json"
      - "experiments/virtual-clients/backend/src/**"
      - ".github/workflows/virtual-clients-ui.yml"

permissions:
  contents: read

concurrency:
  group: virtual-clients-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24.21.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Ownership
        run: npm run verify:ownership

      - name: Typecheck
        run: npm run typecheck

      - name: Contract tests
        run: npm run virtual-clients-ui:test

      - name: Build
        run: npm run virtual-clients-ui:build
