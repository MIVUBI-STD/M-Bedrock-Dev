name: Virtual Clients UI

on:
  push:
    branches: [Experimental]
    paths:
      - "apps/virtual-clients-ui/**"
      - "experiments/virtual-clients/backend/src/**"
      - ".github/workflows/virtual-clients-ui.yml"

permissions:
  contents: read

concurrency:
  group: virtual-clients-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-source:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/virtual-clients-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/virtual-clients-ui/package-lock.json
      - name: Install Rust 1.98.1
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build:frontend
      - name: Check Tauri/Rust
        run: npm run check:rust
      - name: Backend presentation contract tests
        working-directory: ${{ github.workspace }}
        run: |
          npm ci --no-audit --no-fund
          npm run virtual-clients-ui:test
