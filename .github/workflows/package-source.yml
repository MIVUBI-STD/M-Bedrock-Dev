# source-refresh: 8e6bdb35
name: Package Source Snapshot

on:
  push:
    branches:
      - Local
    paths:
      - ".github/workflows/package-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture portable Node runtime
        shell: bash
        run: |
          mkdir -p .portable-node
          cp "$(command -v node)" .portable-node/node
          .portable-node/node --version

      - name: Upload portable workspace
        uses: actions/upload-artifact@v4
        with:
          name: m-bedrock-dev-portable
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
