name: Repository Policy

on:
  push:
    branches:
      - Local
      - main
    paths:
      - "AGENTS.md"
      - "CONTEXT.md"
      - "GITHUB_RULES.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "README.md"
      - "VERSION"
      - "toolchain.json"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".editorconfig"
      - ".gitattributes"
      - ".agents/**"
      - "docs/**"
      - "tooling/**"
      - "DEV.cmd"
      - ".github/workflows/**"
  pull_request:
    branches:
      - Local
      - main
    paths:
      - "AGENTS.md"
      - "CONTEXT.md"
      - "GITHUB_RULES.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "README.md"
      - "VERSION"
      - "toolchain.json"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".editorconfig"
      - ".gitattributes"
      - ".agents/**"
      - "docs/**"
      - "tooling/**"
      - "DEV.cmd"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24.21.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Verify repository policy
        run: node tooling/repository/verify.mjs
