name: Repository Policy

on:
  push:
    branches:
      - Local
      - main
    paths:
      - "AGENTS.md"
      - "CONTEXT.md"
      - "GITHUB_RULES.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "README.md"
      - "VERSION"
      - "toolchain.json"
      - "package.json"
      - ".agents/**"
      - "docs/**"
      - "tooling/**"
      - "DEV.cmd"
      - ".github/workflows/**"
  pull_request:
    branches:
      - Local
      - main
    paths:
      - "AGENTS.md"
      - "CONTEXT.md"
      - "GITHUB_RULES.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "README.md"
      - "VERSION"
      - "toolchain.json"
      - "package.json"
      - ".agents/**"
      - "docs/**"
      - "tooling/**"
      - "DEV.cmd"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify repository policy
        run: node tooling/repository/verify.mjs
