name: Virtual Clients Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Virtual Clients version (MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: virtual-clients-draft-release
  cancel-in-progress: false

jobs:
  windows-draft:
    if: github.ref == 'refs/heads/Experimental'
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must be MAJOR.MINOR.PATCH.' }
          $cargo = Get-Content experiments/virtual-clients/backend/Cargo.toml -Raw
          $match = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (!$match.Success -or $match.Groups[1].Value -ne $version) {
            throw "Requested version $version does not match backend Cargo version."
          }

      - name: Install Rust 1.77.2
        shell: pwsh
        run: |
          rustup toolchain install 1.77.2 --profile minimal
          rustup default 1.77.2

      - name: Verify backend
        working-directory: experiments/virtual-clients/backend
        run: |
          cargo check --locked --all-targets
          cargo test --locked --all-targets
          cargo fmt --all --check

      - name: Build release binaries
        working-directory: experiments/virtual-clients/backend
        run: cargo build --locked --release --bins

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (!$iscc) { throw 'Inno Setup 6 is required on the release runner.' }
          "path=$iscc" >> $env:GITHUB_OUTPUT

      - name: Build current-user installer
        shell: pwsh
        run: |
          $source = (Resolve-Path 'experiments/virtual-clients/backend/target/release').Path
          & '${{ steps.inno.outputs.path }}' `
            "/DAppVersion=${{ inputs.version }}" `
            "/DSourceDir=$source" `
            'experiments/virtual-clients/distribution/windows/virtual-clients.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

      - name: Build provenance
        id: release
        shell: pwsh
        run: |
          $dist = Resolve-Path 'experiments/virtual-clients/distribution/windows/dist'
          $installer = @(Get-ChildItem $dist -Filter '*.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected one installer, found $($installer.Count)." }
          $installer = $installer[0]
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii (Join-Path $dist 'SHA256SUMS.txt')

          $provenance = [ordered]@{
            schema = 1
            source_sha = $env:GITHUB_SHA
            version = '${{ inputs.version }}'
            installer = $installer.Name
            installer_sha256 = $hash
            runtime_schema = 1
            trust = 'development-draft'
            self_update_runtime_enabled = $false
          }
          $provenance | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $dist 'build-provenance.json')

          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "dist=$dist" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload draft artifacts
        uses: actions/upload-artifact@v4
        with:
          name: virtual-clients-windows-x86_64
          path: |
            ${{ steps.release.outputs.installer }}
            ${{ steps.release.outputs.dist }}\SHA256SUMS.txt
            ${{ steps.release.outputs.dist }}\build-provenance.json
          if-no-files-found: error
          retention-days: 14

      - name: Create development draft release
        shell: pwsh
        run: |
          $tag = "virtual-clients-dev-v${{ inputs.version }}-$($env:GITHUB_SHA.Substring(0,12))"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Draft release $tag already exists." }
          $global:LASTEXITCODE = 0
          gh release create $tag `
            '${{ steps.release.outputs.installer }}' `
            "${{ steps.release.outputs.dist }}\SHA256SUMS.txt#SHA256SUMS.txt" `
            "${{ steps.release.outputs.dist }}\build-provenance.json#build-provenance.json" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --draft --prerelease `
            --title "M-Bedrock Virtual Clients Development Draft v${{ inputs.version }}" `
            --notes "Development draft only. Exact source SHA: $env:GITHUB_SHA. Self-update remains disabled. Runtime data is preserved by uninstall."
