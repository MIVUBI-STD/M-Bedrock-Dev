name: Virtual Clients Backend

on:
  workflow_dispatch:
  push:
    branches:
      - Experimental
    paths:
      - "experiments/virtual-clients/backend/**"
      - ".github/workflows/virtual-clients.yml"

permissions:
  contents: read

concurrency:
  group: virtual-clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-backend:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    defaults:
      run:
        working-directory: experiments/virtual-clients/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup override set 1.98.1

      - name: Check
        run: cargo check --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets

      - name: Format
        run: cargo fmt --all --check

      - name: Export canonical backend
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: virtual-clients-canonical-backend
          path: |
            experiments/virtual-clients/backend/Cargo.toml
            experiments/virtual-clients/backend/Cargo.lock
            experiments/virtual-clients/backend/src
            experiments/virtual-clients/backend/tests
          if-no-files-found: error
