name: Virtual Clients Backend

on:
  workflow_dispatch:
  push:
    branches:
      - Experimental
    paths:
      - "experiments/virtual-clients/backend/**"
      - ".github/workflows/virtual-clients.yml"

permissions:
  contents: read

concurrency:
  group: virtual-clients-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-backend:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    defaults:
      run:
        working-directory: experiments/virtual-clients/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.77.2
        shell: bash
        run: |
          rustup toolchain install 1.77.2 --profile minimal --component rustfmt
          rustup override set 1.77.2

      - name: Check
        run: cargo check --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets

      - name: Format
        run: cargo fmt --all --check
