name: Virtual Clients Trusted Release

on:
  push:
    tags:
      - "virtual-clients-v*"

permissions:
  contents: read

concurrency:
  group: virtual-clients-trusted-release
  cancel-in-progress: false

jobs:
  windows-trusted-release:
    runs-on: [self-hosted, windows, x64, virtual-clients-signing]
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT: ${{ vars.VIRTUAL_CLIENTS_SIGNING_CERT_THUMBPRINT }}

    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release identity
        id: release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^virtual-clients-v(\d+\.\d+\.\d+)$') { throw 'Tag must be virtual-clients-vMAJOR.MINOR.PATCH.' }
          $version = $Matches[1]
          $cargo = Get-Content experiments/virtual-clients/backend/Cargo.toml -Raw
          $match = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (!$match.Success -or $match.Groups[1].Value -ne $version) { throw "Tag version $version does not match backend Cargo version." }
          $thumbprint = $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
          if ($thumbprint -notmatch '^[A-F0-9]{40}$') { throw 'VIRTUAL_CLIENTS_SIGNING_CERT_THUMBPRINT repository variable is missing or invalid.' }
          $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT = $thumbprint
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $thumbprint } | Select-Object -First 1
          if (!$cert -or !$cert.HasPrivateKey) { throw 'Signing certificate with private key is not available in CurrentUser\My.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Rust 1.98.1
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup override set 1.98.1 experiments/virtual-clients/backend

      - name: Verify backend
        working-directory: experiments/virtual-clients/backend
        run: |
          cargo check --locked --all-targets
          cargo test --locked --all-targets
          cargo fmt --all --check

      - name: Build trusted binaries
        working-directory: experiments/virtual-clients/backend
        run: cargo build --locked --release --bins

      - name: Locate signing tools
        id: tools
        shell: pwsh
        run: |
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source
          if (!$signtool) {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -File -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$signtool) { throw 'signtool.exe is not available on the signing runner.' }
          $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (!$iscc) { throw 'Inno Setup 6 is not available on the signing runner.' }
          "signtool=$signtool" >> $env:GITHUB_OUTPUT
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Sign release binaries
        shell: pwsh
        run: |
          $targets = @('experiments/virtual-clients/backend/target/release/virtual-clients.exe','experiments/virtual-clients/backend/target/release/virtual-guest-agent.exe')
          foreach ($target in $targets) {
            & '${{ steps.tools.outputs.signtool }}' sign /sha1 $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT /fd SHA256 /a $target
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed: $target" }
          }

      - name: Build and sign installer
        id: installer
        shell: pwsh
        run: |
          $source = (Resolve-Path 'experiments/virtual-clients/backend/target/release').Path
          & '${{ steps.tools.outputs.iscc }}' "/DAppVersion=${{ steps.release.outputs.version }}" "/DSourceDir=$source" 'experiments/virtual-clients/distribution/windows/virtual-clients.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $dist = Resolve-Path 'experiments/virtual-clients/distribution/windows/dist'
          $installer = @(Get-ChildItem $dist -Filter '*.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected one installer, found $($installer.Count)." }
          $installer = $installer[0]
          & '${{ steps.tools.outputs.signtool }}' sign /sha1 $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT /fd SHA256 /a $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer Authenticode signing failed.' }
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "dist=$dist" >> $env:GITHUB_OUTPUT

      - name: Verify Authenticode identity
        shell: pwsh
        run: |
          $expected = $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT
          $targets = @('experiments/virtual-clients/backend/target/release/virtual-clients.exe','experiments/virtual-clients/backend/target/release/virtual-guest-agent.exe','${{ steps.installer.outputs.path }}')
          $proof = @()
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid' -or !$signature.SignerCertificate) { throw "Authenticode verification failed for $target: $($signature.Status)" }
            $actual = $signature.SignerCertificate.Thumbprint.Replace(' ', '').ToUpperInvariant()
            if ($actual -ne $expected) { throw "Signer thumbprint mismatch for $target." }
            $proof += [ordered]@{ file = [IO.Path]::GetFileName($target); status = [string]$signature.Status; signer_thumbprint = $actual; signer_subject = $signature.SignerCertificate.Subject }
          }
          $proof | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path '${{ steps.installer.outputs.dist }}' 'signing-proof.json')

      - name: Build trusted release metadata
        shell: pwsh
        run: |
          $installer = Get-Item '${{ steps.installer.outputs.path }}'
          $dist = '${{ steps.installer.outputs.dist }}'
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii (Join-Path $dist 'SHA256SUMS.txt')
          & 'experiments/virtual-clients/distribution/write-update-manifest.ps1' -Version '${{ steps.release.outputs.version }}' -InstallerName $installer.Name -AuthenticodeThumbprint $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT -InstallerSha256 $hash -OutputPath (Join-Path $dist 'latest.json')
          $provenance = [ordered]@{ schema = 1; source_sha = $env:GITHUB_SHA; version = '${{ steps.release.outputs.version }}'; installer = $installer.Name; installer_sha256 = $hash; runtime_schema = 1; publisher_certificate_thumbprint = $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT; trust = 'authenticode-verified'; self_update_runtime_enabled = $false }
          $provenance | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $dist 'build-provenance.json')

      - name: Upload trusted release candidate
        uses: actions/upload-artifact@v4
        with:
          name: virtual-clients-trusted-windows-x86_64
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.dist }}\latest.json
            ${{ steps.installer.outputs.dist }}\SHA256SUMS.txt
            ${{ steps.installer.outputs.dist }}\build-provenance.json
            ${{ steps.installer.outputs.dist }}\signing-proof.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Stable release $tag already exists." }
          $global:LASTEXITCODE = 0
          gh release create $tag '${{ steps.installer.outputs.path }}' "${{ steps.installer.outputs.dist }}\latest.json#latest.json" "${{ steps.installer.outputs.dist }}\SHA256SUMS.txt#SHA256SUMS.txt" "${{ steps.installer.outputs.dist }}\build-provenance.json#build-provenance.json" "${{ steps.installer.outputs.dist }}\signing-proof.json#signing-proof.json" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "M-Bedrock Virtual Clients v${{ steps.release.outputs.version }}" --notes "Authenticode-verified stable release. Exact source SHA: $env:GITHUB_SHA. Runtime self-apply remains disabled."
