name: Virtual Clients Trusted Release

on:
  push:
    tags:
      - "virtual-clients-v*"

permissions:
  contents: read

concurrency:
  group: virtual-clients-trusted-release
  cancel-in-progress: false

jobs:
  windows-trusted-release:
    runs-on: [self-hosted, windows, x64, virtual-clients-signing]
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT: ${{ vars.VIRTUAL_CLIENTS_SIGNING_CERT_THUMBPRINT }}

    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release identity
        id: release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^virtual-clients-v(\d+\.\d+\.\d+)$') { throw 'Tag must be virtual-clients-vMAJOR.MINOR.PATCH.' }
          $version = $Matches[1]

          $experimentalHead = (gh api "repos/$env:GITHUB_REPOSITORY/branches/Experimental" --jq '.commit.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or !$experimentalHead) { throw 'Experimental branch head could not be resolved.' }
          if ($experimentalHead -ne $env:GITHUB_SHA) {
            throw "Trusted release tag must point at current Experimental HEAD. Tag=$env:GITHUB_SHA Experimental=$experimentalHead"
          }

          $cargo = Get-Content experiments/virtual-clients/backend/Cargo.toml -Raw
          $match = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"\s*$')
          if (!$match.Success -or $match.Groups[1].Value -ne $version) {
            throw "Tag version $version does not match backend Cargo version."
          }

          $thumbprint = $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
          if ($thumbprint -notmatch '^[A-F0-9]{40}$') {
            throw 'VIRTUAL_CLIENTS_SIGNING_CERT_THUMBPRINT repository variable is missing or invalid.'
          }
          "VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
          $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT = $thumbprint

          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $thumbprint } | Select-Object -First 1
          if (!$cert -or !$cert.HasPrivateKey) {
            throw 'Signing certificate with private key is not available in CurrentUser\My.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $paths = @(
            'experiments/virtual-clients/distribution/write-update-manifest.ps1',
            'experiments/virtual-clients/guest/windows/install-guest-agent.ps1',
            'experiments/virtual-clients/guest/windows/prepare-base.ps1',
            'experiments/virtual-clients/guest/windows/finalize-base.ps1',
            'experiments/virtual-clients/guest/windows/uninstall-guest-agent.ps1',
            'experiments/virtual-clients/acceptance/windows/collect-acceptance.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $details = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "$path has PowerShell parser errors: $details"
            }
          }

      - name: Setup Node 24.21.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Virtual Clients UI
        run: npm run virtual-clients-ui:build

      - name: Install Rust 1.98.1
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup override set 1.98.1 experiments/virtual-clients/backend

      - name: Verify backend
        working-directory: experiments/virtual-clients/backend
        run: |
          cargo check --locked --all-targets
          cargo test --locked --all-targets
          cargo fmt --all --check

      - name: Build trusted binaries
        working-directory: experiments/virtual-clients/backend
        run: cargo build --locked --release --bins

      - name: Locate signing tools
        id: tools
        shell: pwsh
        run: |
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source
          if (!$signtool) {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -File -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$signtool) { throw 'signtool.exe is not available on the signing runner.' }

          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (!$iscc) { throw 'Inno Setup 6 is not available on the signing runner.' }

          "signtool=$signtool" >> $env:GITHUB_OUTPUT
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Sign release binaries
        shell: pwsh
        run: |
          $targets = @(
            'experiments/virtual-clients/backend/target/release/virtual-clients-app.exe',
            'experiments/virtual-clients/backend/target/release/virtual-clients.exe',
            'experiments/virtual-clients/backend/target/release/virtual-clients-bridge.exe',
            'experiments/virtual-clients/backend/target/release/virtual-guest-agent.exe'
          )
          foreach ($target in $targets) {
            & '${{ steps.tools.outputs.signtool }}' sign /sha1 $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT /fd SHA256 /a $target
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed: $target" }
          }

      - name: Build and sign installer
        id: installer
        shell: pwsh
        run: |
          $source = (Resolve-Path 'experiments/virtual-clients/backend/target/release').Path
          $ui = (Resolve-Path 'dist/virtual-clients-ui').Path
          & '${{ steps.tools.outputs.iscc }}' `
            "/DAppVersion=${{ steps.release.outputs.version }}" `
            "/DSourceDir=$source" `
            "/DUiDir=$ui" `
            'experiments/virtual-clients/distribution/windows/virtual-clients.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }

          $dist = Resolve-Path 'experiments/virtual-clients/distribution/windows/dist'
          $installer = @(Get-ChildItem $dist -Filter '*.exe' -File)
          if ($installer.Count -ne 1) { throw "Expected one installer, found $($installer.Count)." }
          $installer = $installer[0]

          & '${{ steps.tools.outputs.signtool }}' sign /sha1 $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT /fd SHA256 /a $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer Authenticode signing failed.' }

          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "dist=$dist" >> $env:GITHUB_OUTPUT

      - name: Verify Authenticode identity
        shell: pwsh
        run: |
          $expected = $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT
          $targets = @(
            'experiments/virtual-clients/backend/target/release/virtual-clients.exe',
            'experiments/virtual-clients/backend/target/release/virtual-clients-bridge.exe',
            'experiments/virtual-clients/backend/target/release/virtual-guest-agent.exe',
            '${{ steps.installer.outputs.path }}'
          )
          $proof = @()
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid' -or !$signature.SignerCertificate) {
              throw "Authenticode verification failed for $target: $($signature.Status)"
            }
            $actual = $signature.SignerCertificate.Thumbprint.Replace(' ', '').ToUpperInvariant()
            if ($actual -ne $expected) { throw "Signer thumbprint mismatch for $target." }
            $proof += [ordered]@{
              file = [IO.Path]::GetFileName($target)
              status = [string]$signature.Status
              signer_thumbprint = $actual
              signer_subject = $signature.SignerCertificate.Subject
            }
          }
          $proof | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path '${{ steps.installer.outputs.dist }}' 'signing-proof.json')

      - name: Smoke install signed installer
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'VirtualClientsTrustedInstall'
          if (Test-Path -LiteralPath $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }

          $install = Start-Process -FilePath '${{ steps.installer.outputs.path }}' -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Signed installer failed: $($install.ExitCode)" }

          $appExe = Join-Path $installDir 'virtual-clients-app.exe'
          $hostExe = Join-Path $installDir 'virtual-clients.exe'
          $bridgeExe = Join-Path $installDir 'bridge\virtual-clients-bridge.exe'
          $guestExe = Join-Path $installDir 'guest\virtual-guest-agent.exe'
          $prepare = Join-Path $installDir 'guest\windows\prepare-base.ps1'
          $finalize = Join-Path $installDir 'guest\windows\finalize-base.ps1'
          $acceptance = Join-Path $installDir 'acceptance\windows\collect-acceptance.ps1'
          $releaseChannel = Join-Path $installDir 'distribution\release-channel.json'
          $uiIndex = Join-Path $installDir 'ui\index.html'
          $uiAssets = Join-Path $installDir 'ui\assets'
          foreach ($path in @($appExe, $hostExe, $bridgeExe, $guestExe, $prepare, $finalize, $acceptance, $releaseChannel, $uiIndex)) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Installed file missing: $path" }
          }
          if (!(Test-Path $uiAssets -PathType Container)) { throw 'Virtual Clients UI assets missing after signed install.' }
          if (@(Get-ChildItem $uiAssets -Filter '*.js' -File).Count -lt 1) { throw 'Virtual Clients UI JavaScript bundle missing after signed install.' }

          $probe = Start-Process -FilePath $appExe -ArgumentList @('--probe') -Wait -PassThru
          if ($probe.ExitCode -ne 0) {
            $hostLog = Join-Path $env:LOCALAPPDATA 'M-Bedrock\VirtualClients\desktop-host-error.log'
            if (Test-Path -LiteralPath $hostLog -PathType Leaf) {
              Write-Host 'Desktop host error log:'
              Get-Content -LiteralPath $hostLog | Write-Host
            }
            throw 'Installed desktop host frontend/backend probe failed.'
          }

          & $hostExe help | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI executable smoke test failed.' }

          $request = '{"schema":1,"requestId":1,"command":"policy","args":[]}'
          $bridgeOutput = $request | & $bridgeExe
          if ($LASTEXITCODE -ne 0) { throw 'Installed bridge executable smoke test failed.' }
          $bridgeResponse = $bridgeOutput | ConvertFrom-Json
          if ($bridgeResponse.schema -ne 1 -or !$bridgeResponse.success -or $bridgeResponse.requestId -ne 1) {
            throw 'Installed bridge protocol response is invalid.'
          }

          $runtimeRoot = Join-Path $env:LOCALAPPDATA 'M-Bedrock\VirtualClients'
          $runtimeSentinel = Join-Path $runtimeRoot 'trusted-release-preservation-sentinel.txt'
          New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
          Set-Content -LiteralPath $runtimeSentinel -Value 'preserve-runtime-data' -Encoding ascii

          $uninstaller = @(Get-ChildItem $installDir -Filter 'unins*.exe' -File)
          if ($uninstaller.Count -ne 1) { throw 'Expected one uninstaller.' }
          $uninstall = Start-Process -FilePath $uninstaller[0].FullName -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Signed uninstall failed: $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path -LiteralPath $installDir) { throw 'Signed installer smoke-test directory remains after uninstall.' }
          if (!(Test-Path -LiteralPath $runtimeSentinel -PathType Leaf)) {
            throw 'Runtime data was removed by signed uninstall.'
          }
          Remove-Item -LiteralPath $runtimeSentinel -Force
          if ((Get-ChildItem -LiteralPath $runtimeRoot -Force | Measure-Object).Count -eq 0) {
            Remove-Item -LiteralPath $runtimeRoot -Force
          }

      - name: Build trusted release metadata
        shell: pwsh
        run: |
          $installer = Get-Item '${{ steps.installer.outputs.path }}'
          $dist = '${{ steps.installer.outputs.dist }}'
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()

          $schemaSource = Get-Content 'experiments/virtual-clients/backend/src/schema.rs' -Raw
          $schemaMatch = [regex]::Match($schemaSource, '(?m)^pub const CURRENT_RUNTIME_SCHEMA:\s*u32\s*=\s*(\d+);\s*$')
          if (!$schemaMatch.Success) { throw 'CURRENT_RUNTIME_SCHEMA could not be resolved from source.' }
          $runtimeSchema = [int]$schemaMatch.Groups[1].Value

          "$hash  $($installer.Name)" | Set-Content -Encoding ascii (Join-Path $dist 'SHA256SUMS.txt')
          & 'experiments/virtual-clients/distribution/write-update-manifest.ps1' `
            -Version '${{ steps.release.outputs.version }}' `
            -InstallerName $installer.Name `
            -AuthenticodeThumbprint $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT `
            -InstallerSha256 $hash `
            -OutputPath (Join-Path $dist 'latest.json')

          $provenance = [ordered]@{
            schema = 1
            source_sha = $env:GITHUB_SHA
            version = '${{ steps.release.outputs.version }}'
            installer = $installer.Name
            installer_sha256 = $hash
            runtime_schema = $runtimeSchema
            publisher_certificate_thumbprint = $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT
            trust = 'authenticode-verified'
            self_update_runtime_enabled = $false
          }
          $provenance | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $dist 'build-provenance.json')

      - name: Upload trusted release candidate
        uses: actions/upload-artifact@v4
        with:
          name: virtual-clients-trusted-windows-x86_64
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.dist }}\latest.json
            ${{ steps.installer.outputs.dist }}\SHA256SUMS.txt
            ${{ steps.installer.outputs.dist }}\build-provenance.json
            ${{ steps.installer.outputs.dist }}\signing-proof.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Stable release $tag already exists." }
          $global:LASTEXITCODE = 0

          gh release create $tag `
            '${{ steps.installer.outputs.path }}' `
            "${{ steps.installer.outputs.dist }}\latest.json#latest.json" `
            "${{ steps.installer.outputs.dist }}\SHA256SUMS.txt#SHA256SUMS.txt" `
            "${{ steps.installer.outputs.dist }}\build-provenance.json#build-provenance.json" `
            "${{ steps.installer.outputs.dist }}\signing-proof.json#signing-proof.json" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "M-Bedrock Virtual Clients v${{ steps.release.outputs.version }}" `
            --notes "Authenticode-verified stable release. Exact source SHA: $env:GITHUB_SHA. Runtime self-apply remains disabled."
