name: Virtual Clients Trusted Release

on:
  push:
    tags: ["virtual-clients-v*"]

permissions:
  contents: read

concurrency:
  group: virtual-clients-trusted-release
  cancel-in-progress: false

jobs:
  windows-trusted-release:
    runs-on: [self-hosted, windows, x64, virtual-clients-signing]
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/virtual-clients
    env:
      GH_TOKEN: ${{ github.token }}
      VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT: ${{ vars.VIRTUAL_CLIENTS_SIGNING_CERT_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release identity and signing authority
        id: release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^virtual-clients-v(\d+\.\d+\.\d+)$') { throw 'Tag must be virtual-clients-vMAJOR.MINOR.PATCH.' }
          $version = $Matches[1]
          $experimentalHead = (gh api "repos/$env:GITHUB_REPOSITORY/branches/Experimental" --jq '.commit.sha').Trim()
          if ($experimentalHead -ne $env:GITHUB_SHA) { throw 'Trusted release tag must point at current Experimental HEAD.' }

          $rootVersion = (Get-Content (Join-Path $env:GITHUB_WORKSPACE 'VERSION') -Raw).Trim()
          $backendCargo = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'virtual-clients/runtime-core/Cargo.toml') -Raw
          $backendVersion = [regex]::Match($backendCargo, '(?m)^version\s*=\s*"([^"]+)"\s*$').Groups[1].Value
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriCargo = Get-Content src-tauri/Cargo.toml -Raw
          $tauriVersion = [regex]::Match($tauriCargo, '(?m)^version\s*=\s*"([^"]+)"\s*$').Groups[1].Value
          $tauriConfigVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          foreach ($candidate in @($rootVersion, $backendVersion, $packageVersion, $tauriVersion, $tauriConfigVersion)) {
            if ($candidate -ne $version) { throw "Release version drift detected. Tag=$version candidate=$candidate" }
          }

          $thumbprint = $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
          if ($thumbprint -notmatch '^[A-F0-9]{40}$') { throw 'Signing certificate thumbprint is missing or invalid.' }
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $thumbprint } | Select-Object -First 1
          if (!$cert -or !$cert.HasPrivateKey) { throw 'Signing certificate with private key is unavailable.' }
          "VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/virtual-clients/package-lock.json

      - name: Install Rust 1.98.1
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1

      - name: Install exact desktop dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source
        run: npm run verify:source

      - name: Prepare package inputs
        run: |
          npm run prepare:icons
          npm run prepare:package-binaries

      - name: Sign distributed executable payloads
        shell: pwsh
        run: |
          $thumbprint = $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT
          $payloads = @(
            (Get-ChildItem src-tauri\binaries -Filter 'virtual-clients-*-windows-msvc.exe' -File | Select-Object -ExpandProperty FullName),
            (Resolve-Path src-tauri\package-resources\guest\windows\virtual-guest-agent.exe).Path
          )
          if ($payloads.Count -ne 2) { throw "Expected CLI sidecar and Guest Agent payload; found $($payloads.Count)." }
          foreach ($payload in $payloads) {
            & signtool.exe sign /sha1 $thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $payload
            if ($LASTEXITCODE -ne 0) { throw "Failed to sign payload: $payload" }
            $signature = Get-AuthenticodeSignature -LiteralPath $payload
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint.Replace(' ', '').ToUpperInvariant() -ne $thumbprint) {
              throw "Payload signature verification failed: $payload"
            }
          }

      - name: Build signed NSIS installer
        shell: pwsh
        run: |
          $signing = Get-Content src-tauri/tauri.package.conf.json -Raw | ConvertFrom-Json
          $signing.bundle | Add-Member -MemberType NoteProperty -Name windows -Value ([ordered]@{
            certificateThumbprint = $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT
            digestAlgorithm = 'sha256'
          }) -Force
          $signing | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 src-tauri/tauri.signing.conf.json
          npx tauri build --bundles nsis --config src-tauri/tauri.signing.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed: $LASTEXITCODE" }

      - name: Resolve and verify installer
        id: installer
        shell: pwsh
        run: |
          $built = @(Get-ChildItem src-tauri\target\release\bundle\nsis -Filter '*.exe' -File)
          if ($built.Count -ne 1) { throw "Expected one NSIS installer, found $($built.Count)." }
          $releaseDir = Join-Path $PWD 'release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $installer = Join-Path $releaseDir "M-Bedrock-Virtual-Clients-${{ steps.release.outputs.version }}-windows-x86_64.exe"
          Copy-Item $built[0].FullName $installer -Force
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $actual = if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint.Replace(' ', '').ToUpperInvariant() } else { '' }
          if ($signature.Status -ne 'Valid' -or $actual -ne $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT) { throw 'Installer Authenticode verification failed.' }
          "path=$installer" >> $env:GITHUB_OUTPUT
          "dir=$releaseDir" >> $env:GITHUB_OUTPUT

      - name: Build trusted release metadata
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $installer = Get-Item '${{ steps.installer.outputs.path }}'
          $dist = '${{ steps.installer.outputs.dir }}'
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          $schemaSource = Get-Content 'virtual-clients/runtime-core/src/schema.rs' -Raw
          $runtimeSchema = [regex]::Match($schemaSource, '(?m)^pub const CURRENT_RUNTIME_SCHEMA:\s*u32\s*=\s*(\d+);\s*$')
          $guestSource = Get-Content 'virtual-clients/runtime-core/src/guest.rs' -Raw
          $guestProtocol = [regex]::Match($guestSource, '(?m)^pub const GUEST_AGENT_PROTOCOL_VERSION:\s*u32\s*=\s*(\d+);\s*$')
          $guestSchema = [regex]::Match($guestSource, '(?m)^pub const GUEST_STATUS_SCHEMA:\s*u32\s*=\s*(\d+);\s*$')
          if (!$runtimeSchema.Success -or !$guestProtocol.Success -or !$guestSchema.Success) { throw 'Release protocol metadata could not be resolved.' }

          "$hash  $($installer.Name)" | Set-Content -Encoding ascii (Join-Path $dist 'SHA256SUMS.txt')
          & 'virtual-clients/distribution/write-update-manifest.ps1' -Version '${{ steps.release.outputs.version }}' -InstallerName $installer.Name -AuthenticodeThumbprint $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT -InstallerSha256 $hash -OutputPath (Join-Path $dist 'latest.json')
          [ordered]@{
            schema = 1
            source_sha = $env:GITHUB_SHA
            version = '${{ steps.release.outputs.version }}'
            desktop_stack = 'tauri2-svelte5'
            installer = $installer.Name
            installer_sha256 = $hash
            runtime_schema = [int]$runtimeSchema.Groups[1].Value
            guest_agent_version = '${{ steps.release.outputs.version }}'
            guest_agent_protocol = [int]$guestProtocol.Groups[1].Value
            guest_status_schema = [int]$guestSchema.Groups[1].Value
            publisher_certificate_thumbprint = $env:VIRTUAL_CLIENTS_PUBLISHER_CERT_THUMBPRINT
            payloads_authenticode_signed = $true
            trust = 'authenticode-verified'
            self_update_runtime_enabled = $false
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $dist 'build-provenance.json')

      - name: Publish stable release
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Stable release $tag already exists." }
          $global:LASTEXITCODE = 0
          gh release create $tag '${{ steps.installer.outputs.path }}' "${{ steps.installer.outputs.dir }}\latest.json#latest.json" "${{ steps.installer.outputs.dir }}\SHA256SUMS.txt#SHA256SUMS.txt" "${{ steps.installer.outputs.dir }}\build-provenance.json#build-provenance.json" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "M-Bedrock Virtual Clients v${{ steps.release.outputs.version }}" --notes "Authenticode-verified Virtual Clients release. Exact source SHA: $env:GITHUB_SHA."
