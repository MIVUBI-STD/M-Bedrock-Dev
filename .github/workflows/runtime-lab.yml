name: Runtime Lab Backend

on:
  workflow_dispatch:
  push:
    branches:
      - Experimental
    paths:
      - "experiments/runtime-lab/backend/**"
      - ".github/workflows/runtime-lab.yml"

permissions:
  contents: read

concurrency:
  group: runtime-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-backend:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    defaults:
      run:
        working-directory: experiments/runtime-lab/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.77.2
        shell: bash
        run: |
          rustup toolchain install 1.77.2 --profile minimal --component rustfmt
          rustup override set 1.77.2

      - name: Check
        run: cargo check --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets

      - name: Format source
        run: cargo fmt --all

      - name: Export formatted source
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-lab-formatted-source
          path: |
            experiments/runtime-lab/backend/Cargo.toml
            experiments/runtime-lab/backend/Cargo.lock
            experiments/runtime-lab/backend/src
            experiments/runtime-lab/backend/tests
          if-no-files-found: error
