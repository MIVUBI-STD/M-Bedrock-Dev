name: Virtual Clients Package Smoke

on:
  push:
    branches: [Experimental]
    paths:
      - "apps/virtual-clients/**"
      - "experiments/virtual-clients/backend/**"
      - "experiments/virtual-clients/guest/windows/**"
      - "experiments/virtual-clients/acceptance/windows/**"
      - "experiments/virtual-clients/distribution/**"
      - ".github/workflows/virtual-clients-package-smoke.yml"

permissions:
  contents: read

concurrency:
  group: virtual-clients-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/virtual-clients
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/virtual-clients/package-lock.json
      - name: Install Rust 1.98.1
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
      - name: Install exact desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Build unsigned NSIS package smoke
        run: npm run build:app
      - name: Validate package artifact
        id: package
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'src-tauri\target\release\bundle\nsis'
          $installers = @(Get-ChildItem $bundle -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one Tauri NSIS installer, found $($installers.Count)." }
          $installer = $installers[0]
          if ($installer.Length -le 0) { throw 'Tauri NSIS installer is empty.' }
          $sidecars = Join-Path $PWD 'src-tauri\binaries'
          if (@(Get-ChildItem $sidecars -Filter 'virtual-clients-*-windows-msvc.exe' -File).Count -ne 1) { throw 'CLI sidecar missing.' }
          $guestAgent = Join-Path $PWD 'src-tauri\package-resources\guest\windows\virtual-guest-agent.exe'
          if (!(Test-Path -LiteralPath $guestAgent -PathType Leaf)) { throw 'Guest Agent package payload missing.' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "### Virtual Clients package smoke" >> $env:GITHUB_STEP_SUMMARY
          "Tauri NSIS package built from commit $env:GITHUB_SHA." >> $env:GITHUB_STEP_SUMMARY
          "PACKAGE_SMOKE only; not native VMware/Minecraft acceptance." >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - name: Install and uninstall package smoke
        shell: pwsh
        run: |
          $installer = '${{ steps.package.outputs.installer_path }}'
          $installDir = Join-Path $env:RUNNER_TEMP 'virtual-clients-package-smoke-install'
          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }

          $runtimeRoot = Join-Path $env:LOCALAPPDATA 'M-Bedrock\VirtualClients'
          New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
          $runtimeSentinel = Join-Path $runtimeRoot 'package-smoke-preserve.txt'
          'preserve-runtime-data' | Set-Content -LiteralPath $runtimeSentinel -Encoding utf8

          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent NSIS install failed with exit code $($install.ExitCode)."
          }

          $required = @(
            (Join-Path $installDir 'm-bedrock-virtual-clients.exe'),
            (Join-Path $installDir 'virtual-clients.exe'),
            (Join-Path $installDir 'guest\windows\virtual-guest-agent.exe'),
            (Join-Path $installDir 'guest\windows\prepare-base.ps1'),
            (Join-Path $installDir 'guest\windows\finalize-base.ps1'),
            (Join-Path $installDir 'acceptance\windows\collect-acceptance.ps1'),
            (Join-Path $installDir 'distribution\release-channel.json')
          )
          foreach ($path in $required) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Installed package is missing required file: $path"
            }
          }

          $uninstaller = @(Get-ChildItem -LiteralPath $installDir -Filter 'uninstall*.exe' -File)
          if ($uninstaller.Count -ne 1) {
            throw "Expected one NSIS uninstaller, found $($uninstaller.Count)."
          }

          $uninstall = Start-Process -FilePath $uninstaller[0].FullName -ArgumentList @('/S') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Silent NSIS uninstall failed with exit code $($uninstall.ExitCode)."
          }
          if (Test-Path -LiteralPath (Join-Path $installDir 'm-bedrock-virtual-clients.exe') -PathType Leaf) {
            throw 'Desktop executable remained after uninstall.'
          }
          if (!(Test-Path -LiteralPath $runtimeSentinel -PathType Leaf)) {
            throw 'Uninstall removed Virtual Clients runtime data.'
          }

          Remove-Item -LiteralPath $runtimeSentinel -Force
          "Silent install/uninstall + packaged resource verification PASS." >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: Virtual-Clients-Package-Smoke-${{ github.sha }}
          path: ${{ steps.package.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 3
