name: Virtual Clients Package Smoke

on:
  push:
    branches: [Experimental]
    paths:
      - "apps/virtual-clients/**"
      - "virtual-clients/runtime-core/**"
      - "virtual-clients/guest/windows/**"
      - "virtual-clients/acceptance/windows/**"
      - "virtual-clients/distribution/**"
      - ".github/workflows/virtual-clients-package-smoke.yml"

permissions:
  contents: read

concurrency:
  group: virtual-clients-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/virtual-clients
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/virtual-clients/package-lock.json
      - name: Install Rust 1.98.1
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
      - name: Install exact desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Build unsigned NSIS package smoke
        run: npm run build:app
      - name: Validate package artifact
        id: package
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'src-tauri\target\release\bundle\nsis'
          $installers = @(Get-ChildItem $bundle -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one Tauri NSIS installer, found $($installers.Count)." }
          $installer = $installers[0]
          if ($installer.Length -le 0) { throw 'Tauri NSIS installer is empty.' }
          $tauri = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($tauri.productName -ne 'M-Bedrock Virtual Clients' -or $tauri.identifier -ne 'com.mivubi.mbedrock.virtualclients') { throw 'Installer product identity drifted.' }
          if ($tauri.version -ne $package.version) { throw 'Tauri/package version drifted.' }
          if ($tauri.bundle.windows.nsis.installMode -ne 'currentUser') { throw 'Installer scope must remain currentUser.' }
          if ($tauri.bundle.windows.allowDowngrades -ne $false) { throw 'Installer downgrade policy must remain disabled.' }
          if ($tauri.bundle.windows.nsis.startMenuFolder -ne 'M-Bedrock Virtual Clients') { throw 'Start Menu ownership drifted.' }
          if ($tauri.bundle.windows.nsis.installerHooks -ne 'windows/installer-hooks.nsh') { throw 'Installer process-in-use policy is not configured.' }
          if ($tauri.bundle.publisher -ne 'MIVUBI-STD' -or [string]::IsNullOrWhiteSpace($tauri.bundle.shortDescription) -or [string]::IsNullOrWhiteSpace($tauri.bundle.longDescription)) {
            throw 'Installer publisher/product metadata is incomplete.'
          }
          $hooks = Get-Content src-tauri\windows\installer-hooks.nsh -Raw
          if ($hooks -notmatch 'NSIS_HOOK_PREINSTALL' -or $hooks -notmatch 'NSIS_HOOK_PREUNINSTALL' -or $hooks -match 'KillProcess|TerminateProcess') {
            throw 'Installer hooks must block an open desktop app without force-killing it.'
          }
          $sidecars = Join-Path $PWD 'src-tauri\binaries'
          if (@(Get-ChildItem $sidecars -Filter 'virtual-clients-*-windows-msvc.exe' -File).Count -ne 1) { throw 'CLI sidecar missing.' }
          $guestAgent = Join-Path $PWD 'src-tauri\package-resources\guest\windows\virtual-guest-agent.exe'
          if (!(Test-Path -LiteralPath $guestAgent -PathType Leaf)) { throw 'Guest Agent package payload missing.' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "### Virtual Clients package smoke" >> $env:GITHUB_STEP_SUMMARY
          "Tauri NSIS package built from commit $env:GITHUB_SHA." >> $env:GITHUB_STEP_SUMMARY
          "PACKAGE_SMOKE only; not native VMware/Minecraft acceptance." >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - name: Install and uninstall package smoke
        shell: pwsh
        run: |
          $installer = '${{ steps.package.outputs.installer_path }}'
          $installDir = Join-Path $env:RUNNER_TEMP 'virtual-clients-package-smoke-install'
          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }

          $runtimeRoot = Join-Path $env:LOCALAPPDATA 'M-Bedrock\VirtualClients'
          New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
          $runtimeSentinel = Join-Path $runtimeRoot 'package-smoke-preserve.txt'
          'preserve-runtime-data' | Set-Content -LiteralPath $runtimeSentinel -Encoding utf8

          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Silent NSIS install failed with exit code $($install.ExitCode)."
          }

          $contractPath = Join-Path $installDir 'distribution\package-contract.json'
          if (!(Test-Path -LiteralPath $contractPath -PathType Leaf)) { throw 'Installed package is missing package-contract.json.' }
          $contract = Get-Content -LiteralPath $contractPath -Raw | ConvertFrom-Json
          if ($contract.schema -ne 1) { throw 'Unsupported package contract schema.' }
          $lifecycle = Get-Content -LiteralPath (Join-Path $installDir 'distribution\install-lifecycle-policy.json') -Raw | ConvertFrom-Json
          if ($lifecycle.schema -ne 1 -or $lifecycle.installer.allowSameVersionRepair -ne $true -or $lifecycle.installer.allowUpgrade -ne $true -or $lifecycle.installer.allowDowngrade -ne $false) {
            throw 'Installed lifecycle policy is invalid.'
          }
          if ($lifecycle.runtimeData.installerMayMigrate -ne $false -or $lifecycle.runtimeData.installerMayDelete -ne $false -or $lifecycle.virtualMachines.installerMayStop -ne $false -or $lifecycle.virtualMachines.installerMayDelete -ne $false -or $lifecycle.virtualMachines.installerMayReprovision -ne $false -or $lifecycle.guest.desktopUninstallMayRemoveGuestAgent -ne $false) {
            throw 'Installer ownership expanded beyond its allowed boundary.'
          }
          foreach ($relative in @($contract.requiredFiles)) {
            $path = Join-Path $installDir ($relative -replace '/', '\')
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Installed package is missing required file: $relative"
            }
          }

          # Same-version reinstall is the repair path. It must restore a missing
          # packaged resource without touching runtime data.
          $repairTarget = Join-Path $installDir 'acceptance\windows\README.md'
          Remove-Item -LiteralPath $repairTarget -Force
          $repair = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($repair.ExitCode -ne 0) { throw "Silent same-version repair failed with exit code $($repair.ExitCode)." }
          if (!(Test-Path -LiteralPath $repairTarget -PathType Leaf)) { throw 'Same-version repair did not restore packaged resources.' }
          if (!(Test-Path -LiteralPath $runtimeSentinel -PathType Leaf)) { throw 'Same-version repair modified runtime data.' }

          $desktopVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $installDir 'm-bedrock-virtual-clients.exe'))
          if ($desktopVersion.ProductVersion -and $desktopVersion.ProductVersion -notlike "$($package.version)*") {
            throw "Installed desktop version drifted from package version: $($desktopVersion.ProductVersion)"
          }

          $uninstaller = @(Get-ChildItem -LiteralPath $installDir -Filter 'uninstall*.exe' -File)
          if ($uninstaller.Count -ne 1) {
            throw "Expected one NSIS uninstaller, found $($uninstaller.Count)."
          }

          $uninstall = Start-Process -FilePath $uninstaller[0].FullName -ArgumentList @('/S') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Silent NSIS uninstall failed with exit code $($uninstall.ExitCode)."
          }
          if (Test-Path -LiteralPath (Join-Path $installDir 'm-bedrock-virtual-clients.exe') -PathType Leaf) {
            throw 'Desktop executable remained after uninstall.'
          }
          if (!(Test-Path -LiteralPath $runtimeSentinel -PathType Leaf)) {
            throw 'Uninstall removed Virtual Clients runtime data.'
          }

          # Reinstall after uninstall must reconnect to preserved runtime data.
          $reinstall = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($reinstall.ExitCode -ne 0) { throw "Silent reinstall failed with exit code $($reinstall.ExitCode)." }
          if (!(Test-Path -LiteralPath (Join-Path $installDir 'm-bedrock-virtual-clients.exe') -PathType Leaf)) {
            throw 'Desktop executable was not restored by reinstall.'
          }
          if (!(Test-Path -LiteralPath $runtimeSentinel -PathType Leaf)) {
            throw 'Reinstall did not preserve existing runtime data.'
          }

          $reinstalledUninstaller = @(Get-ChildItem -LiteralPath $installDir -Filter 'uninstall*.exe' -File)
          if ($reinstalledUninstaller.Count -ne 1) { throw 'Reinstall did not restore one canonical uninstaller.' }
          $cleanup = Start-Process -FilePath $reinstalledUninstaller[0].FullName -ArgumentList @('/S') -Wait -PassThru
          if ($cleanup.ExitCode -ne 0) { throw "Final cleanup uninstall failed with exit code $($cleanup.ExitCode)." }

          Remove-Item -LiteralPath $runtimeSentinel -Force
          "Silent install/uninstall + packaged resource verification PASS." >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: Virtual-Clients-Package-Smoke-${{ github.sha }}
          path: ${{ steps.package.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 3
