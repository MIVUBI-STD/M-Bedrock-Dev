[package]
name = "m-bedrock-virtual-clients-core"
version = "0.1.0"
description = "Experimental M-Bedrock Virtual Clients backend core"
authors = ["MIVUBI-STD"]
edition = "2021"
rust-version = "1.77"
publish = false

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.8"
native-tls = "=0.2.12"
ureq = { version = "=2.9.7", default-features = false, features = ["json", "native-tls"] }
url = "=2.5.0"
sysinfo = { version = "0.30", default-features = false }
